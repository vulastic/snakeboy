<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakeboy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="console">
        <div id="bezel">
            <canvas id="screen"></canvas>
            <p>
                <span>vulastic</span>
                <span>SNAKE BOY</span>
                <span>TM</span>
            </p>
        </div>
        <div id="controls">
            <div id="dpad">
                <button class="arrow dpad-up"></button>
                <button class="arrow dpad-left"></button>
                <button class="arrow dpad-right"></button>
                <button class="arrow dpad-down"></button>
            </div>
            <div id="buttons">
                <div class="button-wrapper">
                    <button class="action-btn"></button>
                    <p>RESET</p>
                </div>
                <div class="button-wrapper">
                    <button class="action-btn"></button>
                    <p>START</p>
                </div>
            </div>
        </div>
        <div id="speaker">
            <p>⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤</p>
            <p>⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤</p>
            <p>⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤ ⬤</p>
        </div>
    </div>
</body>
</html>
